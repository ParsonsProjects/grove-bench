      <h1>Grove Bench: run AI agents side by side, each on its own branch</h1>
      <p>Grove Bench is a free, source-available Windows app that runs several AI coding agents on one project at once. Each works in its own git worktree, on its own branch, with its own terminal.</p>
      <h2>Features</h2>
      <ul>
        <li><strong>Worktrees:</strong> every conversation gets its own git worktree and branch, so agents never write over each other's files.</li>
        <li><strong>Terminals:</strong> each conversation has its own terminal, opened in its worktree.</li>
        <li><strong>Permissions:</strong> when an agent wants to edit a file or run a command, it waits for you to allow or deny it.</li>
        <li><strong>Checkpoints:</strong> a checkpoint is saved each time you send a message, and you can rewind to any of them.</li>
        <li><strong>Project memory:</strong> markdown notes that every conversation reads first.</li>
      </ul>
      <h2>How it works</h2>
      <ol>
        <li>Add a project: pick a folder that uses git.</li>
        <li>Start conversations: each one gets a new branch, worktree and terminal.</li>
        <li>Review and ship: read the diffs, then open a PR from the app or merge the branch your usual way.</li>
      </ol>
      <p>Needs Windows 10 or later, git 2.17 or later and the Claude Code CLI.</p>
      <p><a href="https://github.com/ParsonsProjects/grove-bench/releases">Download for Windows</a> | <a href="https://github.com/ParsonsProjects/grove-bench">View on GitHub</a></p>
