      <h1>Grove Bench: run AI agents side by side, each on its own branch</h1>
      <p>Grove Bench is a free, source-available Windows app for running several AI coding agents on one project at once, starting with Claude Code. Every task gets its own git worktree, branch and terminal, so the agents never trip over each other.</p>
      <h2>A hobby project, vibe coded</h2>
      <p>Grove Bench is something I build on the side, in my spare time. It's vibe coded: AI agents write the code while I steer. You should know that before you install it.</p>
      <ul>
        <li><strong>Bugs are likely.</strong> Some will be small, some may get in your way.</li>
        <li><strong>Things change.</strong> Features, settings and names may change or disappear between releases.</li>
        <li><strong>Help comes when I have time.</strong> It's one person, not a company with a support team.</li>
        <li><strong>Keep your work safe.</strong> Commit or back up anything you can't lose before you point agents at it.</li>
      </ul>
      <p><a href="https://github.com/ParsonsProjects/grove-bench/issues">Report a bug</a></p>
      <h2>Features</h2>
      <ul>
        <li><strong>A branch for every agent:</strong> each thread gets its own git worktree, branch and terminal. Your checkout stays as it is.</li>
        <li><strong>It asks before it acts:</strong> pick a mode per thread (Ask, Plan, Edit, Auto or Read-safe). Anything outside it waits for you.</li>
        <li><strong>Status at a glance:</strong> a small pixel character shows whether each agent is working, needs you or has finished.</li>
        <li><strong>Every message is a checkpoint:</strong> rewind the files and the thread to before any message you sent.</li>
        <li><strong>Naps when idle:</strong> after 30 idle minutes a thread's agent sleeps to save memory and CPU, then wakes where it left off.</li>
        <li><strong>Watch the context fill:</strong> a strip of grove grows along the status bar as the context window fills.</li>
      </ul>
      <h2>How it works</h2>
      <ol>
        <li>Add a project: pick a folder on your computer, ideally a git repository.</li>
        <li>Hand out tasks: each thread starts on a new branch in its own worktree.</li>
        <li>Review and ship: read the diff in the Changes tab, then open a pull request or merge the branch your usual way.</li>
      </ol>
      <p>Needs Windows 10 or later, and either a Claude plan with Claude Code or an Anthropic API key. Git 2.17 or later is recommended.</p>
      <p><a href="https://github.com/ParsonsProjects/grove-bench/releases">Download for Windows</a> | <a href="https://github.com/ParsonsProjects/grove-bench">View on GitHub</a></p>
