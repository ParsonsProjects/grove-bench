<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent monitor as a dialog (mockup)</title>
  </head>
  <body>
    <!-- The agent monitor mockup as a dialog over the demo app
         (docs/agent-monitor-plan.md). Dev server only, never bundled into
         the app: npm start, then open /agent-monitor-dialog.html. -->
    <div id="app"></div>
    <div id="monitor"></div>
    <!-- Mock IPC bridge must evaluate before the app's module graph -->
    <script type="module" src="./src/renderer/demo-mock.ts"></script>
    <script type="module" src="./src/renderer/main.ts"></script>
    <script type="module" src="./src/renderer/agent-monitor-mockup/dialog-main.ts"></script>
  </body>
</html>
