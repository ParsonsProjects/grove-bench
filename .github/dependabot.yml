# Dependabot opens pull requests that update dependencies:
# - version updates: weekly, on Mondays, from this file
# - security updates: when an advisory affects a locked version. These need
#   "Dependabot security updates" turned on in Settings > Advanced Security;
#   groups below shape them, schedule and cooldown don't.
#
# cooldown matches min-release-age=7 in the .npmrc files, so version updates
# only propose releases that are at least 7 days old, which is what the
# Dependency age workflow allows. Security updates skip cooldown: a fix
# released less than 7 days ago fails Dependency age until it's old enough.
# Re-run that check once it is, or, if the fix can't wait, add the package to
# min-release-age-exclude[] in the .npmrc next to the lockfile.
#
# Patch and minor pull requests for tooling, the landing page, acp-spike and
# the actions merge themselves once every check passes (Dependabot auto-merge
# workflow). The rest wait for a review. Majors (a new Electron, say) always
# get a pull request each, since they need more checking.
version: 2
updates:
  # The app. Test, lint and type tooling comes in its own pull request, so it
  # can merge itself. Everything else is bundled into the app (Vite bundles
  # nearly all of package.json) or decides what goes into the installer.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Keep in step with TOOLING in scripts/dependabot-auto-merge.mjs (its
      # test checks).
      tooling:
        patterns:
          - '@eslint/*'
          - 'eslint'
          - 'eslint-*'
          - 'globals'
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - 'knip'
          - 'svelte-check'
          - '@testing-library/*'
          - '@types/*'
        update-types: [minor, patch]
      app:
        patterns: ['*']
        update-types: [minor, patch]
      app-security:
        applies-to: security-updates
        patterns: ['*']

  # Not part of the app: one pull request per folder.
  - package-ecosystem: npm
    directories:
      - /landing
      - /scripts/acp-spike
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    # Dependabot reads .github/workflows from here. The workflows pin actions
    # to commit SHAs with the version in a comment; Dependabot updates both.
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
