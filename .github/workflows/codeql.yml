name: CodeQL

# Static analysis for security bugs in the TypeScript and JavaScript (the app,
# scripts and landing page) and in these workflow files (the "actions"
# language: script injection, over-broad tokens, untrusted checkouts).
# Alerts show under Security > Code scanning, and on pull requests. Runs on
# pull requests, pushes to main, and weekly, since CodeQL updates add queries.
#
# This is CodeQL's "advanced setup". GitHub rejects its uploads while "default
# setup" is on, so leave default setup off in Settings > Advanced Security.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No install or build: both languages are read from source
      # (build-mode none), so node_modules isn't scanned.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
