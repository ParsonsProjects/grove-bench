name: Deploy Landing Page

# Pull requests that change the page build it, without deploying, so a
# broken build (a dependency update, say) shows before it merges.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      # The page draws its characters with the app's own sprite code, and
      # takes its colours and fonts from the app's brand.
      - 'src/renderer/lib/agent-sprite.ts'
      - 'src/renderer/lib/pixel-tree.ts'
      - 'src/shared/brand.ts'
      - 'src/renderer/lib/grove-walk.ts'
      - 'src/renderer/lib/context-grove.ts'
      - 'src/renderer/lib/usage-tone.ts'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    branches: [main]
    # The same paths as push.
    paths:
      - 'landing/**'
      - 'src/renderer/lib/agent-sprite.ts'
      - 'src/renderer/lib/pixel-tree.ts'
      - 'src/shared/brand.ts'
      - 'src/renderer/lib/grove-walk.ts'
      - 'src/renderer/lib/context-grove.ts'
      - 'src/renderer/lib/usage-tone.ts'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's build mustn't cancel a deploy, or the other way round.
  group: ${{ github.event_name == 'pull_request' && format('landing-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: landing
        run: npm ci

      - name: Build
        working-directory: landing
        run: npm run build
        env:
          # PostHog project key (public, it ships in the page). Without the
          # POSTHOG_API_KEY repository variable the page sends no analytics.
          VITE_POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only this job writes to Pages, with an OIDC token to prove it's this
    # workflow. The build job, which runs npm ci, can't.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
