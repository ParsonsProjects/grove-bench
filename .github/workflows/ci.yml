name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'landing/**'
      - '*.md'
      # Only top-level docs: docs/help/*.md is bundled into the app.
      - 'docs/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'landing/**'
      - '*.md'
      - 'docs/*.md'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Skip install scripts (the Electron binary download and node-pty's
        # setup): the type check, tests and Vite build don't need them, since
        # node-pty is mocked and electron is aliased in tests. Packaging is
        # checked by the Package workflow.
        run: npm ci --ignore-scripts

      - name: Type check
        # tsc for .ts files, then svelte-check for the TypeScript in .svelte
        # components, which tsc skips.
        run: npm run typecheck

      - name: Run tests
        # In a random order, so a test that only passes after (or without)
        # another one fails here. The log prints the seed; reproduce with
        # npx vitest run --sequence.shuffle --sequence.seed=<seed>
        run: npm test -- --sequence.shuffle

      - name: Build
        run: npm run build

  lint:
    # Separate from the tests so it runs alongside them. Neither tool needs
    # Windows, so it runs on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      # Each check runs even when the one before it fails, so one push shows
      # every problem.
      - name: Lint
        # Errors listed in eslint-suppressions.json don't fail it, but one
        # that's fixed and still listed does: run npm run lint:prune.
        run: npm run lint

      - name: Unused files, exports and dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run knip

      - name: Check the lint suppressions list
        # ESLint lets eslint-suppressions.json grow and keeps entries for
        # deleted files. This fails on both (scripts/check-lint-suppressions.mjs,
        # which needs no install).
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            node scripts/check-lint-suppressions.mjs FETCH_HEAD
          else
            node scripts/check-lint-suppressions.mjs
          fi
