/* Theme tokens copied from src/renderer/styles/globals.css (Night and Paper). */
:root, [data-theme="night"] {
  --bg: #191815; --card: #201e1b; --border: #272522; --muted: #2b2825; --input: #383531;
  --fg: #d3d1cc; --mfg: #9f9b95; --bright: #f6f5f2;
  --primary: #5ab868; --primary-fg: #091a0d; --accent: #233323;
  --working: #52adef; --attention: #f59e0b; --done: #5ab868; --error: #f14c4c; --link: #52adef;
  --code-inline: #2b2825; --code-block: #201e1b; --code-border: #383531;
  --yellow: oklch(85.2% 0.199 91.936); --purple: oklch(71.4% 0.203 305.504);
  --cyan: oklch(78.9% 0.154 211.53); --green: oklch(79.2% 0.209 151.711);
  --red: oklch(70.4% 0.191 22.216); --red-text: oklch(80.8% 0.114 19.571);
  color-scheme: dark;
}
[data-theme="paper"] {
  --bg: #fefdfa; --card: #f9f8f4; --border: #e5e3de; --muted: #eae8e3; --input: #cdcac4;
  --fg: #393530; --mfg: #68625b; --bright: #221e1a;
  --primary: #257635; --primary-fg: #ffffff; --accent: #d3edd3;
  --working: #1469bc; --attention: #b45309; --done: #257635; --error: #c72e0f; --link: #1469bc;
  --code-inline: #0000001a; --code-block: #f9f8f4; --code-border: #e5e3de;
  --yellow: oklch(54% 0.105 95); --purple: oklch(55.8% 0.288 302.321);
  --cyan: oklch(52% 0.105 223.128); --green: oklch(52.7% 0.154 150.069);
  --red: oklch(50.5% 0.213 27.518); --red-text: oklch(44.4% 0.177 26.899);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'JBM', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
  background: var(--bg); color: var(--fg); font-size: 12px; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--link); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--input); }

/* ───────────── Prototype chrome ───────────── */
.proto-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 50; }
.proto-title { color: var(--mfg); }
.proto-title b { color: var(--fg); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--input); }
.seg button { background: none; border: 0; padding: 3px 10px; cursor: pointer; color: var(--mfg); }
.seg button + button { border-left: 1px solid var(--input); }
.seg button:hover { color: var(--fg); background: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); font-weight: 500; }
.seg-label { font-size: 11px; color: var(--mfg); margin-right: 6px; }
.grp { display: inline-flex; align-items: center; }
.stage { display: flex; gap: 24px; padding: 20px 24px; align-items: flex-start; justify-content: center; }
.notes { width: 310px; flex-shrink: 0; line-height: 1.6; position: sticky; top: 64px; }
.notes h2 { font-size: 14px; margin: 0 0 4px; color: var(--bright); font-weight: 600; }
.notes .sub { color: var(--mfg); margin: 0 0 12px; }
.notes ul { margin: 0 0 12px; padding-left: 16px; }
.notes li { margin-bottom: 6px; }
.notes .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mfg); margin: 14px 0 4px; }
.notes code { background: var(--code-inline); padding: 0 4px; }
.notes .unv { color: var(--mfg); font-size: 11px; }

/* ───────────── App frame ───────────── */
.frame { width: 960px; height: calc(100vh - 116px); min-height: 640px; max-height: 900px; border: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; container-type: inline-size; flex-shrink: 0; }
body[data-width="narrow"] .frame { width: 620px; }
.tabbar { display: flex; border-bottom: 1px solid var(--border); background: var(--card); height: 32px; flex-shrink: 0; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 14px; color: var(--mfg); border-bottom: 2px solid transparent; }
.tab.on { color: var(--fg); border-bottom-color: var(--primary); }
.tab .v { color: var(--primary); }
.tab .n { background: var(--primary); color: var(--primary-fg); font-size: 10px; font-weight: 700; padding: 0 4px; }
.list { flex: 1; overflow-y: auto; overflow-x: hidden; }
.list.current { overflow: hidden; display: flex; align-items: flex-end; }
.list.current img { display: block; }
.statusbar { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--card); font-size: 11px; color: var(--mfg); }
.statusbar .pill { border: 1px solid var(--input); padding: 1px 6px; display: inline-flex; align-items: center; gap: 6px; }
.statusbar .sp { flex: 1; }
.composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; }
.composer .box { flex: 1; border: 1px solid var(--input); padding: 8px 10px; color: var(--mfg); font-size: 14px; }
.composer .send { width: 36px; background: var(--primary); }

/* ───────────── Shared ───────────── */
.m { color: var(--mfg); }
.add { color: var(--green); }
.del { color: var(--red); }
.pass { color: var(--green); }
.fail { color: var(--red); }
.sq { display: inline-block; width: 8px; height: 8px; flex-shrink: 0; }
.sq.done { background: var(--done); }
.sq.attention { background: var(--attention); }
.sq.working { background: var(--working); }
.sq.error { background: var(--error); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.md { font-size: 14px; line-height: 1.6; color: var(--fg); }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md ul { margin: 0 0 8px; padding-left: 20px; }
.md code, .note code { background: var(--code-inline); padding: 1px 5px; }
.md strong { font-weight: 700; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; font-size: 12px; border: 1px solid var(--input); background: none; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--accent); }
.btn.ok { border-color: color-mix(in oklab, var(--green) 55%, transparent); color: var(--green); }
.btn.deny { border-color: color-mix(in oklab, var(--red) 55%, transparent); color: var(--red); }
.btn.xs { height: 20px; padding: 0 6px; font-size: 11px; }
.linkbtn { border: 0; background: none; padding: 0; cursor: pointer; font-size: inherit; }
.linkbtn.pass:hover { text-decoration: underline; }
.linkbtn.m:hover { color: var(--fg); }
pre.out, pre.diff { margin: 0; padding: 6px 8px; font-size: 12px; line-height: 1.5; background: var(--code-block); border: 1px solid var(--code-border); overflow-x: auto; font-family: inherit; }
pre.out { color: var(--mfg); white-space: pre-wrap; }
pre.out.err { color: var(--red-text); }
pre.diff .dl { display: block; padding: 0 4px; margin: 0 -4px; }
pre.diff .dl.add { background: color-mix(in oklab, var(--green) 13%, transparent); }
pre.diff .dl.del { background: color-mix(in oklab, var(--red) 13%, transparent); }
.perm { border: 1px solid color-mix(in oklab, var(--attention) 45%, transparent); border-left: 3px solid var(--attention); background: color-mix(in oklab, var(--attention) 6%, var(--bg)); padding: 10px 12px; }
.perm-h { display: flex; align-items: center; gap: 8px; }
.perm-h b { color: var(--attention); }
.perm-why { margin: 6px 0; }
.perm pre { margin: 6px 0 10px; padding: 6px 10px; background: var(--code-block); border: 1px solid var(--code-border); font-family: inherit; white-space: pre-wrap; }
.perm-act { display: flex; flex-wrap: wrap; gap: 6px; }
.err-box { border: 1px solid color-mix(in oklab, var(--error) 45%, transparent); background: color-mix(in oklab, var(--error) 7%, var(--bg)); padding: 8px 12px; display: flex; align-items: center; gap: 10px; color: var(--red-text); }
.err-box .sp { flex: 1; }
.note { font-size: 12px; line-height: 1.6; color: var(--fg); }
.flash { outline: 1px solid var(--primary); }

/* The prompt row, as UserPromptBlock draws it (all three alternatives) */
.pr { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; background: color-mix(in oklab, var(--primary) 8%, transparent); border-left: 2px solid var(--primary); }
.pr .gt { color: var(--primary); font-size: 14px; line-height: 1.6; }
.pr .p { flex: 1; min-width: 0; font-size: 14px; line-height: 1.6; }
.pr time { font-size: 11px; color: var(--mfg); line-height: 22px; }
.pr .foldbtn { border: 0; background: none; color: var(--mfg); cursor: pointer; line-height: 22px; padding: 0 2px; }
.pr .foldbtn:hover { color: var(--fg); }
/* A turn folded to one line */
.foldline { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 12px; border: 0; border-left: 2px solid var(--input); background: none; text-align: left; cursor: pointer; color: var(--mfg); }
.foldline:hover { background: var(--accent); }
.foldline .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foldline .gt { color: var(--primary); }
.foldline .meta, .foldline time { font-size: 11px; white-space: nowrap; }

/* Compact step rows (D's open steps, F's timeline) */
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; column-gap: 10px; line-height: 20px; }
.row .w { color: var(--mfg); }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.row .t:hover { background: var(--accent); }
.row .r { color: var(--mfg); white-space: nowrap; text-align: right; }
.row.k-edit .w { color: var(--primary); }
.row.k-cmd .w, .row .dollar { color: var(--cyan); }
.row.k-think .w { color: var(--purple); }

/* ═════════════ D · Focus line ═════════════ */

/* ═════════════ F · Work block ═════════════ */

<script>
// ───────────── The sample thread (same as the current build's screenshot) ─────────────
const DIFF_REFRESH = [
  '+const inFlight = new Map<string, Promise<Rotation>>();',
  ' export async function refresh(session: Session) {',
  '-  const next = await rotate(session.refreshToken);',
  '+  let pending = inFlight.get(session.id);',
  '+  if (!pending) {',
  '+    pending = rotate(session.refreshToken).finally(() => inFlight.delete(session.id));',
  '+    inFlight.set(session.id, pending);',
  '+  }',
  '+  const next = await pending;',
  '   session.refreshToken = next.refreshToken;',
];
const DIFF_TEST = ['-  expect(rotate).toHaveBeenCalledTimes(2);', '+  expect(rotate).toHaveBeenCalledTimes(1);'];
const DIFF_TOKENS = [
  '   const claims = jwt.verify(token, key.secret);',
  '+  if (claims.iat * 1000 < key.issuedAfter) {',
  "+    throw new TokenExpiredError('issued before key rotation');",
  '+  }',
  '   return claims;',
];
const OUT_FAIL = 'FAIL test/auth/refresh.test.ts\n  ● refresh › rotates once per expiry\n    Expected: 2\n    Received: 1\n\nTests: 1 failed, 23 passed, 24 total';
const OUT_PASS = 'PASS test/auth/refresh.test.ts\nPASS test/auth/tokens.test.ts\n\nTests: 24 passed, 24 total';

const TURNS = [
  {
    n: 1, prompt: 'Where is the session lifetime set?', time: '10:02', status: 'done', took: '41s', cost: '$0.05',
    steps: [
      { id: 's11', k: 'search', target: 'TTL', where: 'src/auth', res: '1 file' },
      { id: 's12', k: 'read', target: 'src/auth/config.ts', res: '38 lines' },
    ],
    answer: '<p>In <code>src/auth/config.ts</code>. Access tokens last 1 hour (<code>ACCESS_TTL</code>) and refresh tokens 30 days (<code>REFRESH_TTL</code>).</p>',
    files: [],
  },
  {
    n: 2, prompt: 'Sessions drop after exactly one hour. Find out why and fix the refresh flow.', time: '10:16', status: 'done', took: '3m 12s', cost: '$0.41',
    steps: [
      { id: 's21', k: 'think', secs: 4, text: 'One hour matches the access token lifetime. So the refresh is failing, not the token. Look at where refresh is called.' },
      { id: 's22', k: 'note', text: "I'll start with where the refresh token is used." },
      { id: 's23', k: 'search', target: 'refreshToken', where: 'src', res: '4 files' },
      { id: 's24', k: 'read', target: 'src/auth/refresh.ts', res: '182 lines' },
      { id: 's25', k: 'read', target: 'src/http/interceptors.ts', res: '64 lines' },
      { id: 's26', k: 'read', target: 'src/http/client.ts', res: '120 lines' },
      { id: 's27', k: 'note', text: 'Found it: <code>rotate()</code> runs in both the request interceptor and the 401 handler, so a request that refreshes twice invalidates its own new token.' },
      { id: 's28', k: 'edit', target: 'src/auth/refresh.ts', add: 8, del: 1, diff: DIFF_REFRESH },
      { id: 's29', k: 'cmd', target: 'npm test -- auth', ok: false, res: '6 lines', out: OUT_FAIL, retryBy: 's2c' },
      { id: 's2a', k: 'note', text: 'One test still expects two rotations, which was the bug. Updating it.' },
      { id: 's2b', k: 'edit', target: 'test/auth/refresh.test.ts', add: 1, del: 1, diff: DIFF_TEST },
      { id: 's2c', k: 'cmd', target: 'npm test -- auth', ok: true, res: '4 lines', out: OUT_PASS, retryOf: 's29' },
    ],
    answer:
      '<p>Fixed. Sessions dropped because the refresh token was rotated twice when a request hit a 401 while a refresh was already running.</p>' +
      '<p><strong>What changed</strong></p>' +
      "<ul><li><code>refresh()</code> now shares one rotation per session while it's in flight, so concurrent callers reuse the result.</li>" +
      '<li>The test that expected two rotations now expects one.</li></ul>' +
      "<p><strong>Checked:</strong> <code>npm test -- auth</code> passes (24 tests). I didn't run the e2e suite; it needs the staging database.</p>",
    files: [{ path: 'src/auth/refresh.ts', add: 8, del: 1 }, { path: 'test/auth/refresh.test.ts', add: 1, del: 1 }],
  },
];

function liveTurn(live) {
  const cmd = 'npm run db:migrate -- --env=staging';
  const t = {
    n: 3, prompt: 'Also expire refresh tokens issued before the key rotation.', time: '10:27', status: live, live: true, secs: 64,
    steps: [
      { id: 's31', k: 'note', text: "I'll check each token's issue time against the signing key's <code>issuedAfter</code> date in <code>verify()</code>." },
      { id: 's32', k: 'search', target: 'issuedAfter', where: 'src', res: '2 files' },
      { id: 's33', k: 'read', target: 'src/auth/keys.ts', res: '48 lines' },
      { id: 's34', k: 'read', target: 'src/db/schema.ts', res: '210 lines' },
      { id: 's35', k: 'write', target: 'migrations/20261125_signing_keys_issued_after.sql', add: 2, del: 0, diff: ['+ALTER TABLE signing_keys', '+  ADD COLUMN issued_after timestamptz NOT NULL DEFAULT now();'] },
      { id: 's36', k: 'edit', target: 'src/auth/tokens.ts', add: 3, del: 0, diff: DIFF_TOKENS },
    ],
    files: [{ path: 'migrations/20261125_signing_keys_issued_after.sql', add: 2, del: 0 }, { path: 'src/auth/tokens.ts', add: 3, del: 0 }],
  };
  if (live === 'attention') {
    t.permission = { cmd, why: 'Add issued_after to the signing_keys table on staging' };
  } else if (live === 'working') {
    t.steps.push({ id: 's37', k: 'perm', answer: 'allowed', target: cmd });
    t.steps.push({ id: 's38', k: 'cmd', target: cmd, pending: true });
  } else {
    t.steps.push({ id: 's37', k: 'perm', answer: 'allowed', target: cmd });
    t.steps.push({ id: 's38', k: 'cmd', target: cmd, ok: true, res: '1 line', out: 'Applied 20261125_signing_keys_issued_after' });
    t.error = 'The turn stopped: the API was overloaded (529).';
  }
  return t;
}

// ───────────── State ─────────────
const state = { design: 'd', live: 'attention', theme: 'night', width: 'wide' };
(function readHash() {
  const [d, l, th, w] = location.hash.slice(1).split('-');
  if (['current', 'd', 'e', 'f'].includes(d)) state.design = d;
  if (['attention', 'working', 'error'].includes(l)) state.live = l;
  if (['night', 'paper'].includes(th)) state.theme = th;
  if (['wide', 'narrow'].includes(w)) state.width = w;
})();
const allTurns = () => [...TURNS, liveTurn(state.live)];
/** Live steps shown before "Show N earlier steps". */
const LIVE_STEPS = 5;

// ───────────── Helpers ─────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const change = (a, d) => `<span class="add">+${a}</span> <span class="del">−${d}</span>`;
const stateSq = (st) => `<span class="sq ${st}${st === 'attention' || st === 'working' ? ' pulse' : ''}"></span>`;
const fmt = (secs) => (secs < 60 ? `${secs}s` : `${Math.floor(secs / 60)}m ${String(secs % 60).padStart(2, '0')}s`);
const timer = (secs) => `<span class="tick" data-secs="${secs}">${fmt(secs)}</span>`;
const STATE_WORD = { done: 'Done', attention: 'Needs you', working: 'Working', error: 'Failed' };

function tally(t) {
  const c = { read: new Set(), search: 0, files: t.files, add: 0, del: 0, cmd: 0, fail: 0, retried: 0, steps: 0 };
  for (const s of t.steps) {
    if (s.k !== 'note') c.steps++;
    if (s.k === 'read') c.read.add(s.target);
    if (s.k === 'search') c.search++;
    if (s.k === 'cmd') { c.cmd++; if (s.ok === false) { c.fail++; if (s.retryBy) c.retried++; } }
  }
  for (const f of t.files) { c.add += f.add; c.del += f.del; }
  return c;
}
/** The counts, as the cards' strip words them. */
function countParts(t) {
  const c = tally(t);
  const parts = [];
  if (c.read.size) parts.push(`${plural(c.read.size, 'file', 'files')} read`);
  if (c.search) parts.push(plural(c.search, 'search', 'searches'));
  if (c.files.length) parts.push(`${plural(c.files.length, 'file', 'files')} changed ${change(c.add, c.del)}`);
  if (c.cmd) {
    let s = plural(c.cmd, 'command', 'commands');
    if (c.fail) s += `, <span class="fail">${c.fail} failed</span>`;
    if (c.fail && c.retried === c.fail) s += ', <span class="pass">passed on retry</span>';
    parts.push(s);
  }
  return parts;
}
function retryLink(s) {
  if (s.retryBy) return `<button class="linkbtn pass" data-goto="${s.retryBy}">passed on retry ↓</button>`;
  if (s.retryOf) return `<button class="linkbtn m" data-goto="${s.retryOf}">retry of the run that failed ↑</button>`;
  return '';
}
function detailHtml(s) {
  if (s.diff) return `<pre class="diff">${s.diff.map((l) => `<span class="dl ${l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : ''}">${esc(l)}</span>`).join('')}</pre>`;
  if (s.out) return `<pre class="out${s.ok === false ? ' err' : ''}">${esc(s.out)}</pre>`;
  if (s.k === 'think') return `<div class="note m" style="font-style:italic">${esc(s.text)}</div>`;
  return '';
}

/** A step on one line (the current build's TurnStep). Click the target for the rest. */
function stepRow(s) {
  if (s.k === 'note') return `<div class="row-note note" data-id="${s.id}">${s.text}</div>`;
  const word = { read: 'read', search: 'search', edit: 'edit', write: 'write', cmd: 'run', think: 'think', perm: 'asked' }[s.k];
  let target = esc(s.target ?? '');
  if (s.k === 'search') target = `${esc(s.target)} <span class="m">in ${esc(s.where)}</span>`;
  if (s.k === 'cmd') target = `<span class="dollar">$</span> ${esc(s.target)}`;
  if (s.k === 'think') target = esc(s.text);
  let res = '';
  if (s.pending) res = `<span style="color:var(--working)">${stateSq('working')} running</span>`;
  else if (s.k === 'edit' || s.k === 'write') res = change(s.add, s.del);
  else if (s.k === 'cmd' && s.ok === false) res = '<span class="fail">failed</span>';
  else if (s.k === 'perm') res = `<span class="pass">${s.answer}</span>`;
  else if (s.res) res = esc(s.res);
  const more = !!(s.diff || s.out || s.k === 'think');
  return `<div class="row k-${s.k === 'write' ? 'edit' : s.k}" data-id="${s.id}"><span class="w">${word}</span><span class="t"${more ? ' data-toggle' : ''}>${target}</span><span class="r">${res}${retryLink(s)}</span></div>`
    + (more ? `<div class="detail" hidden>${detailHtml(s)}</div>` : '');
}
/** All but the last LIVE_STEPS of a live turn's steps fold into one line. */
function liveSteps(t, render) {
  const hidden = t.live && !t.allSteps ? Math.max(0, t.steps.length - LIVE_STEPS) : 0;
  const more = hidden ? `<div class="d-more"><button class="linkbtn m" data-allsteps="${t.n}">Show ${plural(hidden, 'earlier step', 'earlier steps')}</button></div>` : '';
  return more + t.steps.slice(hidden).map(render).join('');
}
function permissionHtml(p) {
  return `<div class="perm"><div class="perm-h">${stateSq('attention')}<b>Run a command</b><span class="m">the agent is waiting for you</span></div>
    <div class="perm-why">${esc(p.why)}</div><pre>$ ${esc(p.cmd)}</pre>
    <div class="perm-act"><button class="btn ok" data-answer="allowed">Allow</button><button class="btn ok" data-answer="allowed">Allow all commands</button><button class="btn deny" data-answer="denied">Deny</button></div></div>`;
}
const errorHtml = (e) => `<div class="err-box">${stateSq('error')}<span>${esc(e)}</span><span class="sp"></span><button class="btn xs">Retry</button></div>`;
function promptRow(t) {
  return `<div class="pr"><span class="gt">&gt;</span><div class="p">${esc(t.prompt)}</div><time>${t.time}</time>${t.live ? '' : `<button class="foldbtn" data-fold="${t.n}" title="Fold this turn">⌃</button>`}</div>`;
}
function foldLine(t) {
  const c = tally(t);
  const meta = [c.files.length ? `${plural(c.files.length, 'file', 'files')} changed` : 'no changes', t.took, t.cost].join(' · ');
  return `<button class="foldline" data-fold="${t.n}" title="Open this turn"><span>›</span><span class="gt">&gt;</span><span class="p">${esc(t.prompt)}</span><span class="meta">${meta}</span>${stateSq('done')}<time>${t.time}</time></button>`;
}
const isFolded = (t, i, n) => !t.live && (ui.fold[t.n] ?? i < n - 2);
const ui = { fold: {}, open: {}, allSteps: {} };

// ═════════════ D · Focus line ═════════════
function dTurn(t, i, n) {
  if (isFolded(t, i, n)) return `<section class="d-turn">${foldLine(t)}</section>`;
  const open = ui.open[t.n] ?? !!t.live;
  const lead = t.live
    ? `<span class="lead ${t.status}">${stateSq(t.status)}${{ attention: 'Waiting for you', working: 'Working', error: 'Stopped' }[t.status]} · ${timer(t.secs)}</span>`
    : `<span class="lead">${stateSq('done')}Worked ${t.took}</span>`;
  const bits = [...countParts(t), t.cost ? esc(t.cost) : ''].filter(Boolean).map((b) => `<span class="dot">${b}</span>`).join('');
  let body = '';
  if (t.answer) body = `<div class="d-answer md">${t.answer}</div>`;
  else if (t.permission) body = `<div class="d-live">${permissionHtml(t.permission)}</div>`;
  else if (t.error) body = `<div class="d-live">${errorHtml(t.error)}</div>`;
  return `<section class="d-turn">${promptRow(t)}
    <button class="d-sum" aria-expanded="${open}" data-open="${t.n}"><span class="caret">›</span>${lead}${bits}</button>
    <div class="d-steps"${open ? '' : ' hidden'}>${liveSteps({ ...t, allSteps: ui.allSteps[t.n] }, stepRow)}</div>
    ${body}</section>`;
}
const renderD = () => { const ts = allTurns(); return `<div class="d-list">${ts.map((t, i) => dTurn(t, i, ts.length)).join('')}</div>`; };

// ═════════════ E · Grouped activity ═════════════
/** Steps as activity lines: consecutive reads become one line, each else its own. */
function groupSteps(steps) {
  const out = [];
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    if (s.k === 'read') {
      let j = i;
      while (steps[j + 1]?.k === 'read') j++;
      out.push({ kind: 'read', items: steps.slice(i, j + 1), id: s.id });
      i = j;
    } else out.push({ kind: s.k, step: s, id: s.id });
  }
  return out;
}
function eLine(g, live) {
  if (g.kind === 'note') return `<div class="e-note note" data-id="${g.id}">${g.step.text}</div>`;
  if (g.kind === 'read') {
    const n = g.items.length;
    const text = n === 1 ? `<b>Read</b> ${esc(g.items[0].target)}` : `<b>Read</b> ${n} files`;
    const lines = g.items.map((s) => `<div class="file">${esc(s.target)}<span class="m">${esc(s.res)}</span></div>`).join('');
    return `<div class="e-line k-read${n > 1 ? ' more' : ''}" data-id="${g.id}"${n > 1 ? ' data-toggle' : ''}><span class="sq"></span><span class="tx">${text}</span><span class="r">${n === 1 ? esc(g.items[0].res) : `${g.items.reduce((a, s) => a + parseInt(s.res), 0)} lines`}</span></div>`
      + (n > 1 ? `<div class="e-sub" hidden>${lines}</div>` : '');
  }
  const s = g.step;
  let verb; let tx; let res = ''; let cls = '';
  switch (s.k) {
    case 'think': verb = 'Thought'; tx = `for ${s.secs}s`; cls = 'k-think'; break;
    case 'search': verb = 'Searched for'; tx = `${esc(s.target)} <span class="o">in ${esc(s.where)}</span>`; res = esc(s.res); break;
    case 'edit': verb = 'Edited'; tx = esc(s.target); res = change(s.add, s.del); cls = 'k-edit'; break;
    case 'write': verb = 'Wrote'; tx = esc(s.target); res = change(s.add, s.del); cls = 'k-edit'; break;
    case 'perm': verb = 'Asked to run'; tx = esc(s.target); res = `<span class="pass">${s.answer}</span>`; cls = 'asked'; break;
    case 'cmd':
      verb = s.pending ? 'Running' : 'Ran'; tx = `<span class="o">$</span> ${esc(s.target)}`; cls = 'k-cmd';
      if (s.pending) { cls += ' pending'; res = `<span style="color:var(--working)">${timer(8)}</span>`; }
      else if (s.ok === false) { cls += ' failed'; res = '<span class="fail">failed</span>'; }
      else res = esc(s.res);
      break;
  }
  const more = !!(s.diff || s.out || s.k === 'think');
  return `<div class="e-line ${cls}${more ? ' more' : ''}" data-id="${s.id}"${more ? ' data-toggle' : ''}><span class="sq${s.pending ? ' pulse' : ''}"></span><span class="tx"><b>${verb}</b> ${tx}</span><span class="r">${res}${retryLink(s)}</span></div>`
    + (more ? `<div class="e-sub" hidden>${detailHtml(s)}</div>` : '');
}
function eTurn(t, i, n) {
  if (isFolded(t, i, n)) return `<section class="e-turn">${foldLine(t)}</section>`;
  const groups = groupSteps(t.steps);
  const hidden = t.live && !ui.allSteps[t.n] ? Math.max(0, groups.length - LIVE_STEPS) : 0;
  const more = hidden ? `<div class="e-note"><button class="linkbtn m" data-allsteps="${t.n}">Show ${plural(hidden, 'earlier line', 'earlier lines')}</button></div>` : '';
  const acts = more + groups.slice(hidden).map((g) => eLine(g, t.live)).join('');
  let body = '';
  if (t.answer) body = `<div class="e-answer md">${t.answer}</div>`;
  else if (t.permission) body = `<div class="e-live">${permissionHtml(t.permission)}</div>`;
  else if (t.error) body = `<div class="e-live">${errorHtml(t.error)}</div>`;
  const c = tally(t);
  const done = t.live ? '' : `<div class="e-done">${stateSq('done')}<span>Done in ${t.took}</span><span>${t.cost}</span>${c.files.length ? `<span>${plural(c.files.length, 'file', 'files')} changed ${change(c.add, c.del)}</span>` : ''}</div>`;
  return `<section class="e-turn">${promptRow(t)}<div class="e-acts">${acts}</div>${body}${done}</section>`;
}
const renderE = () => { const ts = allTurns(); return `<div class="e-list">${ts.map((t, i) => eTurn(t, i, ts.length)).join('')}</div>`; };

// ═════════════ F · Work block ═════════════
function fNow(t) {
  if (t.permission) return `${stateSq('attention')}<span class="m">Asked to run <span style="color:var(--fg)">${esc(t.permission.cmd)}</span></span>`;
  const last = [...t.steps].reverse().find((s) => s.k !== 'note');
  if (!last) return '';
  const verb = last.pending ? 'Running' : { read: 'Read', search: 'Searched for', edit: 'Edited', write: 'Wrote', cmd: 'Ran', perm: 'Asked to run', think: 'Thought' }[last.k];
  return `${stateSq(last.pending ? 'working' : t.status)}<span class="m">${verb} <span style="color:var(--fg)">${esc(last.target ?? '')}</span></span>`;
}
function fTurn(t, i, n) {
  if (isFolded(t, i, n)) return `<section class="f-turn">${foldLine(t)}</section>`;
  const open = ui.open[t.n] ?? false;
  const c = tally(t);
  let lab;
  if (t.live) lab = `<span class="lab ${t.status}">${{ attention: 'Waiting for you', working: 'Working', error: 'Stopped' }[t.status]} · ${timer(t.secs)}</span>`;
  else lab = `<span class="lab">Worked for ${t.took}</span>`;
  const extra = [`${plural(c.steps, 'step', 'steps')}`];
  if (c.fail) extra.push(`<span class="fail">${c.fail} failed</span>${c.retried === c.fail ? ', <span class="pass">passed on retry</span>' : ''}`);
  const steps = t.steps.map((s) => `<div class="f-step k-${s.k === 'write' ? 'edit' : s.k}${s.ok === false ? ' failed' : ''}${s.pending ? ' pending' : ''}"><i class="${s.pending ? 'pulse' : ''}"></i><div>${stepRow(s)}</div></div>`).join('');
  const now = t.live && !open ? `<div class="f-now">${fNow(t)}</div>` : '';
  let body = '';
  if (t.answer) body = `<div class="f-answer md">${t.answer}</div>`;
  else if (t.permission) body = `<div class="f-live">${permissionHtml(t.permission)}</div>`;
  else if (t.error) body = `<div class="f-live">${errorHtml(t.error)}</div>`;
  const files = c.files.length || t.cost
    ? `<div class="f-files">${c.files.length ? `<span>${t.live ? 'Changed so far' : 'Files changed'}</span>` : ''}${c.files.map((f) => `<span class="chip" title="Open ${esc(f.path)} in your editor">${esc(f.path.split('/').pop())} ${change(f.add, f.del)}</span>`).join('')}<span class="sp"></span>${t.cost ? `<span>${t.cost}</span>` : ''}</div>`
    : '';
  return `<section class="f-turn">${promptRow(t)}
    <div class="f-block${t.live ? ` live ${t.status}` : ''}">
      <button class="f-head" aria-expanded="${open}" data-open="${t.n}"><span class="caret">›</span>${t.live ? stateSq(t.status) : ''}${lab}<span>· ${extra.join(' · ')}</span></button>
      ${now}<div class="f-tl"${open ? '' : ' hidden'}>${steps}</div>
    </div>${body}${files}</section>`;
}
const renderF = () => { const ts = allTurns(); return `<div class="f-list">${ts.map((t, i) => fTurn(t, i, ts.length)).join('')}</div>`; };

const renderCurrent = () => `<img alt="The Summary view as built: turn cards, same sample thread" src="${CURRENT[state.theme + '-' + state.width]}" width="${state.width === 'wide' ? 958 : 618}">`;

// ═════════════ Notes ═════════════
const SRC = {
  focus: '<a href="https://code.claude.com/docs/en/fullscreen" target="_blank">Claude Code docs, fullscreen</a>',
  desktop: '<a href="https://code.claude.com/docs/en/desktop" target="_blank">Claude Code docs, desktop</a>',
  interactive: '<a href="https://code.claude.com/docs/en/interactive-mode" target="_blank">Claude Code docs, interactive mode</a>',
  claudeai: '<a href="https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings" target="_blank">Claude help centre, thinking</a>',
  grok: '<a href="https://x.ai/news/grok-4-fast" target="_blank">xAI, Grok 4 Fast</a>',
  groknotes: '<a href="https://grok.com/release-notes" target="_blank">grok.com release notes</a>',
};
const NOTES = {
  current: `<h2>Current build</h2><p class="sub">The Summary view as it is on the branch now (turn cards), from the demo harness with this same thread. The live turn switch doesn't apply here.</p>
    <ul><li>A box per turn: prompt, work strip, answer, then a footer with files, time and cost.</li>
    <li>Folded steps behind the strip; the live turn shows its last five.</li></ul>`,
  d: `<h2>D · Focus line</h2><p class="sub">The cards without the box: prompt, one summary line, answer.</p>
    <div class="tag">Based on</div>
    <ul><li>Claude Code's <code>/focus</code>: "only your last prompt, a one-line summary of tool calls with edit diffstats, and the final response" (${SRC.focus}, checked).</li></ul>
    <div class="tag">Changes from the cards</div>
    <ul><li>No border, no footer. The turn's edge is the prompt row and the space above it.</li>
    <li>Time, files, +/−, commands and cost all sit on the summary line.</li>
    <li>Steps open under the line with a thin rule, same one-line rows as now.</li></ul>
    <div class="tag">Trade-offs</div>
    <ul><li>The quietest. Files changed are only a count; to open one you open the steps or use the Changes tab.</li>
    <li>Turn edges are weaker than cards, especially when an answer is long.</li></ul>
    <div class="tag">Try</div><ul><li>Click the summary line, then a step's target for its output or diff.</li></ul>`,
  e: `<h2>E · Grouped activity</h2><p class="sub">The steps always show, but as short verb lines with repeats merged.</p>
    <div class="tag">Based on</div>
    <ul><li>Claude Code desktop's Normal view: "Tool calls collapsed into summaries, with full text responses" (${SRC.desktop}, checked).</li>
    <li>Merged repeats such as "Called slack 3 times" (${SRC.interactive}, checked).</li>
    <li>Thinking as a "Thought for Ns" row. <span class="unv">Reported for Claude Code's VS Code view; I didn't check it.</span></li></ul>
    <div class="tag">Changes from the cards</div>
    <ul><li>No strip to open: each step is one line, "Read 3 files", "Edited src/auth/refresh.ts +8 −1", "Ran $ npm test -- auth · failed".</li>
    <li>Consecutive reads merge into one line you can open. While running, the verb says so ("Running", with a timer).</li>
    <li>The answer follows, then "Done in 3m 12s · $0.41 · 2 files changed".</li></ul>
    <div class="tag">Trade-offs</div>
    <ul><li>Shows the most of what the agent did without a click, so long turns stay long (the live turn still shows its last five lines).</li>
    <li>Easiest to scan for what changed; noisiest to read answers in.</li></ul>
    <div class="tag">Try</div><ul><li>Open "Read 3 files". Click "passed on retry ↓".</li></ul>`,
  f: `<h2>F · Work block</h2><p class="sub">All the work in one closed block above the answer; files under it like sources.</p>
    <div class="tag">Based on</div>
    <ul><li>claude.ai: a "Thinking" indicator with a timer, then an expandable "Thinking" section above the answer (${SRC.claudeai}). <span class="unv">From the research; I didn't check the page myself.</span></li>
    <li>Grok: "Thought for 24 seconds" above its reasoning, thinking steps shown as separate steps, and a sources panel (${SRC.grok}, ${SRC.groknotes}). <span class="unv">From search snippets only.</span></li></ul>
    <div class="tag">Changes from the cards</div>
    <ul><li>One bordered block, closed by default: "Worked for 3m 12s · 9 steps · 1 failed, passed on retry".</li>
    <li>While live, it stays closed and shows only the current step under a ticking timer, rather than the last five.</li>
    <li>Inside, the steps sit on a timeline. Changed files are chips under the answer, with the cost.</li></ul>
    <div class="tag">Trade-offs</div>
    <ul><li>Familiar from chat apps, and the calmest while live. You see one step at a time unless you open it.</li>
    <li>Two boxes per turn when a permission is waiting (block and prompt).</li></ul>
    <div class="tag">Try</div><ul><li>Switch Live turn to Working and watch the timer. Open the block.</li></ul>`,
};

// ───────────── Render and wire up ─────────────
let tick = null;
function render() {
  document.body.dataset.theme = state.theme;
  document.body.dataset.width = state.width;
  for (const [id, key] of [['seg-design', 'design'], ['seg-live', 'live'], ['seg-theme', 'theme'], ['seg-width', 'width']]) {
    for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', String(b.dataset.v === state[key]));
  }
  const list = document.getElementById('list');
  const keep = list.scrollTop;
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  list.className = 'list' + (state.design === 'current' ? ' current' : '');
  list.innerHTML = { current: renderCurrent, d: renderD, e: renderE, f: renderF }[state.design]();
  document.getElementById('notes').innerHTML = NOTES[state.design];
  document.getElementById('sb-state').innerHTML = `${stateSq(state.live)} ${STATE_WORD[state.live]}`;
  history.replaceState(null, '', `#${state.design}-${state.live}-${state.theme}-${state.width}`);
  list.scrollTop = render.first || atBottom ? list.scrollHeight : keep;
  render.first = false;
  // Live timers tick while the turn works or waits.
  clearInterval(tick);
  if (state.live !== 'error') {
    tick = setInterval(() => {
      for (const el of document.querySelectorAll('.tick')) {
        const s = Number(el.dataset.secs) + 1;
        el.dataset.secs = String(s);
        el.textContent = fmt(s);
      }
    }, 1000);
  }
}
render.first = true;

for (const [id, key] of [['seg-design', 'design'], ['seg-live', 'live'], ['seg-theme', 'theme'], ['seg-width', 'width']]) {
  document.getElementById(id).addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state[key] = b.dataset.v;
    if (key === 'design' || key === 'live') render.first = true;
    render();
  });
}
document.getElementById('list').addEventListener('click', (e) => {
  const el = e.target;
  const ans = el.closest('[data-answer]');
  if (ans) { state.live = 'working'; render(); return; }
  const go = el.closest('[data-goto]');
  if (go) {
    const target = document.querySelector(`[data-id="${go.dataset.goto}"]`);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.add('flash');
      setTimeout(() => target.classList.remove('flash'), 1500);
    }
    return;
  }
  const all = el.closest('[data-allsteps]');
  if (all) { ui.allSteps[all.dataset.allsteps] = true; render(); return; }
  const fold = el.closest('[data-fold]');
  if (fold) {
    const n = fold.dataset.fold;
    ui.fold[n] = !fold.classList.contains('foldline');
    render();
    return;
  }
  const open = el.closest('[data-open]');
  if (open) { ui.open[open.dataset.open] = open.getAttribute('aria-expanded') !== 'true'; render(); return; }
  const tog = el.closest('[data-toggle]');
  if (tog) {
    const row = tog.closest('[data-id]') ?? tog;
    const next = row.nextElementSibling;
    if (next && (next.classList.contains('detail') || next.classList.contains('e-sub'))) {
      next.hidden = !next.hidden;
      row.classList.toggle('open', !next.hidden);
    }
  }
});

render();
</script>
