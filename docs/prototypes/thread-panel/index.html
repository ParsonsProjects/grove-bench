/* Theme tokens copied from src/renderer/styles/globals.css (Night and Paper). */
:root, [data-theme="night"] {
  --bg: #191815; --card: #201e1b; --border: #272522; --muted: #2b2825; --input: #383531;
  --fg: #d3d1cc; --mfg: #9f9b95; --bright: #f6f5f2;
  --primary: #5ab868; --primary-fg: #091a0d; --accent: #233323;
  --working: #52adef; --attention: #f59e0b; --done: #5ab868; --error: #f14c4c; --link: #52adef;
  --code-inline: #2b2825; --code-block: #201e1b; --code-border: #383531; --quote-border: #4a4641;
  /* Tailwind palette, dark shades */
  --yellow: oklch(85.2% 0.199 91.936); --purple: oklch(71.4% 0.203 305.504);
  --cyan: oklch(78.9% 0.154 211.53); --green: oklch(79.2% 0.209 151.711);
  --red: oklch(70.4% 0.191 22.216); --red-text: oklch(80.8% 0.114 19.571);
  --amber: oklch(76.9% 0.188 70.08);
  --shadow: 0 10px 30px oklch(0 0 0 / 0.45);
  color-scheme: dark;
}
[data-theme="paper"] {
  --bg: #fefdfa; --card: #f9f8f4; --border: #e5e3de; --muted: #eae8e3; --input: #cdcac4;
  --fg: #393530; --mfg: #68625b; --bright: #221e1a;
  --primary: #257635; --primary-fg: #ffffff; --accent: #d3edd3;
  --working: #1469bc; --attention: #b45309; --done: #257635; --error: #c72e0f; --link: #1469bc;
  --code-inline: #0000001a; --code-block: #f9f8f4; --code-border: #e5e3de; --quote-border: #cdcac4;
  /* The light theme's swapped shades (globals.css) */
  --yellow: oklch(54% 0.105 95); --purple: oklch(55.8% 0.288 302.321);
  --cyan: oklch(52% 0.105 223.128); --green: oklch(52.7% 0.154 150.069);
  --red: oklch(50.5% 0.213 27.518); --red-text: oklch(44.4% 0.177 26.899);
  --amber: oklch(55.5% 0.163 48.998);
  --shadow: 0 10px 30px oklch(0 0 0 / 0.12);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'JBM', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
  background: var(--bg); color: var(--fg); font-size: 12px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
code { font-family: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--input); }
::-webkit-scrollbar-track { background: transparent; }

/* ───────────── Prototype chrome (not part of any design) ───────────── */
.proto-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
  padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--card);
  position: sticky; top: 0; z-index: 50;
}
.proto-title { font-size: 12px; color: var(--mfg); }
.proto-title b { color: var(--fg); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--input); }
.seg button {
  background: none; border: 0; padding: 3px 10px; cursor: pointer; color: var(--mfg); font-size: 12px;
}
.seg button + button { border-left: 1px solid var(--input); }
.seg button:hover { color: var(--fg); background: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); font-weight: 500; }
.seg-label { font-size: 11px; color: var(--mfg); margin-right: 6px; }
.grp { display: inline-flex; align-items: center; }
.stage { display: flex; gap: 24px; padding: 20px 24px; align-items: flex-start; justify-content: center; }
.notes {
  width: 300px; flex-shrink: 0; font-size: 12px; line-height: 1.6; color: var(--fg);
  position: sticky; top: 64px;
}
.notes h2 { font-size: 14px; margin: 0 0 4px; color: var(--bright); font-weight: 600; }
.notes .sub { color: var(--mfg); margin: 0 0 12px; }
.notes ul { margin: 0 0 12px; padding-left: 16px; }
.notes li { margin-bottom: 6px; }
.notes .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mfg); margin: 14px 0 4px; }
.notes kbd { border: 1px solid var(--input); padding: 0 4px; font-size: 11px; font-family: inherit; }

/* ───────────── The app frame around the message list ───────────── */
.frame {
  width: 960px; height: calc(100vh - 88px); min-height: 640px; max-height: 900px;
  border: 1px solid var(--border); background: var(--bg);
  display: flex; flex-direction: column; container-type: inline-size; flex-shrink: 0;
}
body[data-width="narrow"] .frame { width: 620px; }
.tabbar { display: flex; border-bottom: 1px solid var(--border); background: var(--card); height: 32px; flex-shrink: 0; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 14px; color: var(--mfg); font-size: 12px; border-bottom: 2px solid transparent; }
.tab.on { color: var(--fg); border-bottom-color: var(--primary); }
.tab .n { background: var(--primary); color: var(--primary-fg); font-size: 10px; font-weight: 700; padding: 0 4px; }
.list { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
.list.current { overflow: hidden; display: flex; align-items: flex-end; }
.list.current img { display: block; }
.statusbar {
  display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; flex-shrink: 0;
  border-top: 1px solid var(--border); background: var(--card); font-size: 11px; color: var(--mfg);
}
.statusbar .pill { border: 1px solid var(--input); padding: 1px 6px; }
.statusbar .sp { flex: 1; }
.composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; }
.composer .box { flex: 1; border: 1px solid var(--input); padding: 8px 10px; color: var(--mfg); font-size: 14px; }
.composer .send { width: 36px; background: var(--primary); }

/* ───────────── Shared bits ───────────── */
.m { color: var(--mfg); }
.add { color: var(--green); }
.del { color: var(--red); }
.pass { color: var(--green); }
.fail { color: var(--red); }
.sq { display: inline-block; width: 8px; height: 8px; flex-shrink: 0; }
.sq.done { background: var(--done); }
.sq.attention { background: var(--attention); }
.sq.working { background: var(--working); }
.sq.error { background: var(--error); }
.sq.idle { background: var(--input); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

.md { font-size: 14px; line-height: 1.6; color: var(--fg); }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md ul { margin: 0 0 8px; padding-left: 20px; }
.md li { margin-bottom: 2px; }
.md code { background: var(--code-inline); padding: 1px 5px; font-size: 13px; }
.md strong { font-weight: 700; color: var(--fg); }

.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; font-size: 12px;
  border: 1px solid var(--input); background: none; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--accent); }
.btn.ok { border-color: color-mix(in oklab, var(--green) 55%, transparent); color: var(--green); }
.btn.ok:hover { background: color-mix(in oklab, var(--green) 12%, transparent); }
.btn.deny { border-color: color-mix(in oklab, var(--red) 55%, transparent); color: var(--red); }
.btn.deny:hover { background: color-mix(in oklab, var(--red) 12%, transparent); }
.btn.quiet { border-color: transparent; color: var(--mfg); padding: 0 6px; }
.btn.quiet:hover { color: var(--fg); }
.btn.xs { height: 20px; padding: 0 6px; font-size: 11px; }

/* Step rows (A and B) */
.steps { font-size: 12px; }
.row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; column-gap: 10px;
  line-height: 22px; padding: 0 6px; margin: 0 -6px;
}
.row .w { color: var(--mfg); }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.row .r { color: var(--mfg); text-align: right; white-space: nowrap; }
.row.k-edit .w { color: var(--primary); }
.row.k-cmd .w { color: var(--cyan); }
.row.k-cmd .dollar { color: var(--cyan); }
.row.failed { background: color-mix(in oklab, var(--red) 8%, transparent); }
.row.more { cursor: pointer; }
.row.more:hover { background: var(--accent); }
.row.more .t::after { content: ' ›'; color: var(--mfg); }
.row.more.open .t::after { content: ' ⌄'; }
.row.note { display: block; padding-left: 68px; line-height: 1.6; padding-top: 3px; padding-bottom: 3px; color: var(--fg); position: relative; }
.row.note::before { content: '·'; position: absolute; left: 6px; color: var(--mfg); }
.row.note code, .c-note code { background: var(--code-inline); padding: 0 4px; }
.row.think { display: block; }
.row.think summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 1fr); column-gap: 10px; }
.row.think summary::-webkit-details-marker { display: none; }
.row.think .w { color: var(--purple); }
.row.think .t { color: var(--mfg); font-style: italic; }
.row.think .tb { padding: 2px 0 6px 62px; color: var(--mfg); font-style: italic; line-height: 1.6; }
.row.perm-done .w { color: var(--mfg); }
.detail { margin: 2px 0 6px 62px; }
.detail[hidden] { display: none; }
pre.out, pre.diff {
  margin: 0; padding: 6px 8px; font-size: 12px; line-height: 1.5; background: var(--code-block);
  border: 1px solid var(--code-border); overflow-x: auto; white-space: pre; font-family: inherit;
}
pre.out { color: var(--mfg); white-space: pre-wrap; }
pre.out.err { color: var(--red-text); }
pre.diff .dl { display: block; padding: 0 4px; margin: 0 -4px; }
pre.diff .dl.add { background: color-mix(in oklab, var(--green) 13%, transparent); color: var(--fg); }
pre.diff .dl.del { background: color-mix(in oklab, var(--red) 13%, transparent); color: var(--fg); }

/* The permission prompt (shared shape; each design places it) */

}

  display: grid; grid-template-columns: 46px 16px 48px minmax(0, 1fr) auto; column-gap: 8px;
  font-size: 12px; line-height: 22px;
}

.c-node { position: relative; }
.c-node::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 1px; background: var(--input); }
.c-node::after { content: ''; position: absolute; left: 4px; top: 8px; width: 7px; height: 7px; background: var(--mfg); }

.c-turn > .c-row:last-child .c-node::before { bottom: calc(100% - 11px); }
.c-row .c-w { color: var(--mfg); }
.c-row .c-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-row .c-r { color: var(--mfg); white-space: nowrap; text-align: right; }
.c-row.k-edit .c-w { color: var(--primary); }
.c-row.k-edit .c-node::after { background: var(--primary); }
.c-row.k-cmd .c-w { color: var(--cyan); }
.c-row.k-cmd .c-node::after { background: var(--cyan); }

.c-prompt { margin-top: 4px; }

.c-prompt .c-p { grid-column: 3 / 6; font-size: 14px; line-height: 22px; color: var(--bright); font-weight: 600; padding: 0 0 4px; }
.c-prompt .c-p .gt { color: var(--primary); margin-right: 6px; }
.c-prompt .c-time { color: var(--fg); }
.c-note > .c-x, .c-answer > .c-x, .c-perm > .c-x, .c-err > .c-x { grid-column: 3 / 6; padding: 3px 0; }
.c-note .c-node::after { width: 5px; height: 1px; top: 11px; left: 5px; background: var(--mfg); }
.c-note .c-x { color: var(--fg); line-height: 1.6; }
.c-answer .c-node::after { background: var(--done); width: 9px; height: 9px; left: 3px; top: 7px; }
.c-answer .c-x { padding: 6px 12px 8px; margin: 2px 0 4px; background: var(--card); border: 1px solid var(--border); }
.c-answer .c-x .lab { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mfg); margin-bottom: 4px; }
.c-end .c-node::after { width: 9px; height: 1px; left: 3px; top: 11px; background: var(--input); }
.c-end .c-x { grid-column: 3 / 6; font-size: 11px; color: var(--mfg); display: flex; gap: 12px; flex-wrap: wrap; }
.c-perm .c-node::after { background: var(--attention); }
.c-perm .c-node.pulse::after, .c-row.pending .c-node::after { animation: pulse 1.4s ease-in-out infinite; }
.c-row.pending .c-node::after { background: var(--working); }
.c-err .c-node::after { background: var(--error); }
/* The node spans the row's second line (an open diff or output), so the rail stays unbroken */
.c-row > .c-node { grid-row: 1 / span 2; }
.c-row > .c-time { grid-row: 1; }
.c-sub { grid-row: 2; grid-column: 3 / 6; }
.c-sub[hidden] { display: none; }
.c-sub .detail { margin: 2px 0 6px; }
.c-group { color: var(--mfg); }
.c-outline { border-left: 1px solid var(--border); padding: 10px 10px; align-self: start; position: sticky; top: 33px; font-size: 11px; }
.c-outline .hd { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mfg); margin: 0 0 6px 4px; }
.c-outline button {
  display: grid; grid-template-columns: 8px 14px minmax(0, 1fr); column-gap: 6px; align-items: start; width: 100%;
  border: 0; background: none; text-align: left; cursor: pointer; padding: 5px 4px; color: var(--fg); line-height: 1.45;
}
.c-outline button:hover { background: var(--accent); }
.c-outline button .sq { margin-top: 4px; }
.c-outline .n { color: var(--mfg); }
.c-outline .p { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.c-outline .s { grid-column: 3; color: var(--mfg); font-size: 10px; margin-top: 2px; }
/* Filters. Prompts and turn ends always stay, and so does anything that
   waits for you or stopped the turn (.c-keep). */
.c-wrap[data-filter="edit"] .c-row:not(.c-prompt):not(.c-end):not(.c-keep):not(.k-edit),
.c-wrap[data-filter="cmd"] .c-row:not(.c-prompt):not(.c-end):not(.c-keep):not(.k-cmd),
.c-wrap[data-filter="fail"] .c-row:not(.c-prompt):not(.c-end):not(.c-keep):not(.failed),
.c-wrap[data-filter="answer"] .c-row:not(.c-prompt):not(.c-end):not(.c-keep):not(.c-answer) { display: none; }
.c-wrap[data-filter]:not([data-filter="all"]) .c-sub { display: none; }
@container (width < 760px) {
  .c-body { grid-template-columns: minmax(0, 1fr); }
  .c-outline { display: none; }
  .c-tools .jump { display: inline-flex; }
  .c-row { grid-template-columns: 40px 16px 44px minmax(0, 1fr) auto; column-gap: 6px; }
}

<script>
// ───────────── The sample thread (same content as the "Current" screenshot) ─────────────
const DIFF_REFRESH = [
  '+const inFlight = new Map<string, Promise<Rotation>>();',
  ' ',
  ' export async function refresh(session: Session) {',
  '-  const next = await rotate(session.refreshToken);',
  '+  let pending = inFlight.get(session.id);',
  '+  if (!pending) {',
  '+    pending = rotate(session.refreshToken)',
  '+      .finally(() => inFlight.delete(session.id));',
  '+    inFlight.set(session.id, pending);',
  '+  }',
  '+  const next = await pending;',
  '   session.refreshToken = next.refreshToken;',
];
const DIFF_TEST = [
  '   await Promise.all([client.get("/a"), client.get("/b")]);',
  '-  expect(rotate).toHaveBeenCalledTimes(2);',
  '+  expect(rotate).toHaveBeenCalledTimes(1);',
];
const DIFF_TOKENS = [
  '   const claims = jwt.verify(token, key.secret);',
  '+  if (claims.iat * 1000 < key.issuedAfter) {',
  "+    throw new TokenExpiredError('issued before key rotation');",
  '+  }',
  '   return claims;',
];
const OUT_FAIL = 'FAIL test/auth/refresh.test.ts\n  ● refresh › rotates once per expiry\n    Expected: 2\n    Received: 1\n\nTests: 1 failed, 23 passed, 24 total';
const OUT_PASS = 'PASS test/auth/refresh.test.ts\nPASS test/auth/tokens.test.ts\n\nTests: 24 passed, 24 total';

const TURNS = [
  {
    n: 1, prompt: 'Where is the session lifetime set?', time: '10:02', status: 'done', took: '41s', cost: '$0.05',
    steps: [
      { k: 'search', target: 'TTL', where: 'src/auth', res: '2 files', at: '+0:03' },
      { k: 'read', target: 'src/auth/config.ts', res: '38 lines', at: '+0:06' },
    ],
    answer: '<p>In <code>src/auth/config.ts</code>. Access tokens last 1 hour (<code>ACCESS_TTL</code>) and refresh tokens 30 days (<code>REFRESH_TTL</code>). Nothing else overrides them.</p>',
    files: [],
    answerAt: '+0:41',
  },
  {
    n: 2, prompt: 'Sessions drop after exactly one hour. Find out why and fix the refresh flow.', time: '10:16', status: 'done', took: '3m 12s', cost: '$0.41',
    steps: [
      { k: 'think', text: 'One hour matches the access token lifetime, so the refresh is failing, not the token. Look at where refresh is called.', at: '+0:00' },
      { k: 'note', text: "I'll start with where the refresh token is used.", at: '+0:03' },
      { k: 'search', target: 'refreshToken', where: 'src', res: '4 files', at: '+0:05' },
      { k: 'read', target: 'src/auth/refresh.ts', res: '182 lines', at: '+0:08' },
      { k: 'read', target: 'src/http/interceptors.ts', res: '64 lines', at: '+0:09' },
      { k: 'read', target: 'src/http/client.ts', res: '120 lines', at: '+0:11' },
      { k: 'note', text: 'Found it: <code>rotate()</code> runs in both the request interceptor and the 401 handler, so a request that refreshes twice invalidates its own new token.', at: '+0:52' },
      { k: 'edit', target: 'src/auth/refresh.ts', add: 8, del: 1, diff: DIFF_REFRESH, at: '+1:20' },
      { k: 'cmd', target: 'npm test -- auth', ok: false, res: '1 failed, 23 passed', out: OUT_FAIL, at: '+1:41', id: 'run1' },
      { k: 'note', text: 'One test still expects two rotations, which was the bug. Updating it.', at: '+2:30' },
      { k: 'edit', target: 'test/auth/refresh.test.ts', add: 1, del: 1, diff: DIFF_TEST, at: '+2:38' },
      { k: 'cmd', target: 'npm test -- auth', ok: true, res: '24 passed', out: OUT_PASS, at: '+2:59', retryOf: 'run1' },
    ],
    answer:
      '<p>Fixed. Sessions dropped because the refresh token was rotated twice when a request hit a 401 while a refresh was already running.</p>' +
      '<p><strong>What changed</strong></p>' +
      "<ul><li><code>refresh()</code> now shares one rotation per session while it's in flight, so concurrent callers reuse the result.</li>" +
      '<li>The test that expected two rotations now expects one.</li></ul>' +
      "<p><strong>Checked:</strong> <code>npm test -- auth</code> passes (24 tests). I didn't run the e2e suite; it needs the staging database.</p>",
    files: [{ path: 'src/auth/refresh.ts', add: 8, del: 1 }, { path: 'test/auth/refresh.test.ts', add: 1, del: 1 }],
    answerAt: '+3:12',
  },
];

/** The live turn, in the state the "Live turn" switch picks. */
function liveTurn(live) {
  const t = {
    n: 3, prompt: 'Also expire refresh tokens issued before the key rotation.', time: '10:27', status: live, took: '1m 04s', live: true,
    steps: [
      { k: 'note', text: "I'll check each token's issue time against the signing key's <code>issuedAfter</code> date in <code>verify()</code>.", at: '+0:04' },
      { k: 'read', target: 'src/auth/keys.ts', res: '48 lines', at: '+0:07' },
      { k: 'edit', target: 'src/auth/tokens.ts', add: 3, del: 0, diff: DIFF_TOKENS, at: '+0:31' },
    ],
    files: [{ path: 'src/auth/tokens.ts', add: 3, del: 0 }],
  };
  const cmd = 'npm run db:migrate -- --env=staging';
  if (live === 'attention') {
    t.permission = { what: 'Run a command', cmd, why: 'Add issued_after to the signing_keys table on staging', at: '+0:58' };
    t.activity = 'Waiting for you';
  } else if (live === 'working') {
    t.steps.push({ k: 'perm', answer: state.answered ?? 'Allowed', target: cmd, at: '+0:58' });
    t.steps.push({ k: 'cmd', target: cmd, pending: true, at: '+1:02' });
    t.activity = 'Running ' + cmd;
  } else {
    t.steps.push({ k: 'perm', answer: 'Allowed', target: cmd, at: '+0:58' });
    t.steps.push({ k: 'cmd', target: cmd, ok: true, res: '1 migration', out: 'Applied 20261125_signing_keys_issued_after', at: '+1:02' });
    t.error = { text: 'The turn stopped: the API was overloaded (529).', at: '+1:04' };
    t.activity = 'Stopped';
  }
  return t;
}

// ───────────── State ─────────────
const state = { design: 'a', live: 'attention', theme: 'night', width: 'wide', answered: null, cFilter: 'all' };
(function readHash() {
  const [d, l, th, w] = location.hash.slice(1).split('-');
  if (['current', 'a', 'b', 'c'].includes(d)) state.design = d;
  if (['attention', 'working', 'error'].includes(l)) state.live = l;
  if (['night', 'paper'].includes(th)) state.theme = th;
  if (['wide', 'narrow'].includes(w)) state.width = w;
})();
const allTurns = () => [...TURNS, liveTurn(state.live)];

// ───────────── Helpers ─────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function tally(t) {
  const c = { read: 0, search: 0, edits: new Set(), cmd: 0, fail: 0, add: 0, del: 0 };
  for (const s of t.steps) {
    if (s.k === 'read') c.read++;
    if (s.k === 'search') c.search++;
    if (s.k === 'edit') { c.edits.add(s.target); c.add += s.add; c.del += s.del; }
    if (s.k === 'cmd') { c.cmd++; if (s.ok === false) c.fail++; }
  }
  c.edit = c.edits.size;
  return c;
}
const STATE_WORD = { done: 'Done', attention: 'Needs you', working: 'Working', error: 'Failed' };
const stateSq = (st) => `<span class="sq ${st}${st === 'attention' || st === 'working' ? ' pulse' : ''}"></span>`;
const changeHtml = (add, del) => `<span class="add">+${add}</span> <span class="del">−${del}</span>`;

function resultHtml(s) {
  if (s.k === 'edit') return changeHtml(s.add, s.del);
  if (s.k === 'cmd') {
    if (s.pending) return '<span class="running"><span class="sq working pulse"></span>running 8s</span>';
    return `<span class="${s.ok ? 'pass' : 'fail'}">${esc(s.res)}</span>`;
  }
  return esc(s.res ?? '');
}
function detailHtml(s) {
  if (s.diff) return `<pre class="diff">${s.diff.map((l) => `<span class="dl ${l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : ''}">${esc(l)}</span>`).join('')}</pre>`;
  if (s.out) return `<pre class="out${s.ok === false ? ' err' : ''}">${esc(s.out)}</pre>`;
  return '';
}

/** A step as a row (A and B). Failed commands open by default. */
function stepRow(s) {
  if (s.k === 'note') return `<div class="row note">${s.text}</div>`;
  if (s.k === 'think') {
    return `<details class="row think"><summary><span class="w">think</span><span class="t">${esc(s.text)}</span></summary><div class="tb">${esc(s.text)}</div></details>`;
  }
  if (s.k === 'perm') {
    const ok = s.answer !== 'Denied';
    return `<div class="row perm-done"><span class="w">asked</span><span class="t"><span class="${ok ? 'pass' : 'fail'}">${esc(s.answer)}</span> <span class="m">to run</span> ${esc(s.target)}</span><span class="r"></span></div>`;
  }
  const word = { read: 'read', search: 'search', edit: 'edit', cmd: 'run' }[s.k];
  const target = s.k === 'search' ? `${esc(s.target)} <span class="m">in ${esc(s.where)}</span>`
    : s.k === 'cmd' ? `<span class="dollar">$</span> ${esc(s.target)}` : esc(s.target);
  const more = !!(s.diff || s.out);
  const open = s.ok === false;
  return `<div class="row k-${s.k}${s.ok === false ? ' failed' : ''}${more ? ' more' : ''}${open ? ' open' : ''}"${more ? ' role="button" tabindex="0"' : ''}>`
    + `<span class="w">${word}</span><span class="t">${target}</span><span class="r">${resultHtml(s)}</span></div>`
    + (more ? `<div class="detail"${open ? '' : ' hidden'}>${detailHtml(s)}</div>` : '');
}

function permissionHtml(p) {
  return `<div class="perm">
    <div class="perm-h">${stateSq('attention')}<b>${esc(p.what)}</b><span class="m">the agent is waiting for you</span></div>
    <div class="perm-why">${esc(p.why)}</div>
    <pre>$ ${esc(p.cmd)}</pre>
    <div class="perm-act">
      <button class="btn ok" data-answer="Allowed">Allow</button>
      <button class="btn ok" data-answer="Allowed all">Allow all commands</button>
      <button class="btn deny" data-answer="Denied">Deny</button>
    </div>
  </div>`;
}
const errorHtml = (e) => `<div class="err-box">${stateSq('error')}<span>${esc(e.text)}</span><span class="sp"></span><button class="btn xs">Retry</button></div>`;

// ═════════════ A · Turn cards ═════════════
function trailHtml(t) {
  const cells = t.steps.filter((s) => s.k !== 'note' && s.k !== 'perm').map((s) => {
    const cls = s.k === 'edit' ? 'k-edit' : s.k === 'cmd' ? (s.pending ? 'run' : s.ok === false ? 'fail' : 'k-cmd') : s.k === 'think' ? 'k-think' : '';
    return `<i class="${cls}${s.pending ? ' pulse' : ''}"></i>`;
  });
  if (t.permission) cells.push('<i class="wait pulse"></i>');
  return `<span class="trail" aria-hidden="true">${cells.join('')}</span>`;
}
function aCounts(t) {
  const c = tally(t);
  const parts = [];
  if (c.read) parts.push(`<span>${plural(c.read, 'file', 'files')} read</span>`);
  if (c.search) parts.push(`<span>${plural(c.search, 'search', 'searches')}</span>`);
  if (c.edit) parts.push(`<span>${c.edit} edited ${changeHtml(c.add, c.del)}</span>`);
  if (c.cmd) parts.push(`<span>${plural(c.cmd, 'command', 'commands')}${c.fail ? `, <span class="fail">${c.fail} failed</span>` : ''}</span>`);
  return `<span class="a-counts">${parts.join('')}</span>`;
}
function aTurn(t, { folded, workOpen }) {
  const st = t.status;
  const c = tally(t);
  const foldMeta = [c.edit ? plural(c.edit, 'file', 'files') + ' changed' : 'no changes', t.took, t.cost].filter(Boolean).join(' · ');
  const stateHtml = st === 'done'
    ? `${stateSq('done')}`
    : `<span class="state ${st}">${stateSq(st)}${STATE_WORD[st]}</span>`;
  const head = `<button class="a-head" data-fold>
      <span class="gt">&gt;</span>
      <span class="a-prompt">${esc(t.prompt)}</span>
      <span class="a-meta"><span class="a-fold">${foldMeta}</span>${stateHtml}<time>${t.time}</time></span>
    </button>`;
  const workLabel = t.live ? `<span class="took">${esc(t.activity)}</span> <span>${t.took}</span>` : `<span class="took">Worked ${t.took}</span>`;
  const work = `<button class="a-work" aria-expanded="${workOpen}" data-toggle-next>
      <span class="caret">›</span>${workLabel}${trailHtml(t)}${aCounts(t)}
    </button>
    <div class="a-steps steps"${workOpen ? '' : ' hidden'}>${t.steps.map(stepRow).join('')}</div>`;
  let middle = '';
  if (t.answer) middle = `<div class="a-answer md">${t.answer}</div>`;
  else if (t.permission) middle = `<div class="a-live">${permissionHtml(t.permission)}</div>`;
  else if (t.error) middle = `<div class="a-live">${errorHtml(t.error)}</div>`;
  const files = t.files.length
    ? `<span class="lbl">${t.live ? 'Changed so far' : 'Changed'}</span>${t.files.map((f) => `<span class="fchip">${esc(f.path)} ${changeHtml(f.add, f.del)}</span>`).join('')}`
    : '<span class="lbl">No files changed</span>';
  const foot = `<div class="a-foot">${files}<span class="sp"></span>${t.cost ? `<span>${t.cost}</span>` : ''}
      ${t.live ? '' : '<button class="btn quiet xs">Rewind</button><button class="btn quiet xs">Copy</button>'}</div>`;
  return `<section class="a-turn st-${st}${folded ? ' folded' : ''}" data-turn="${t.n}">${head}<div class="a-body">${work}${middle}${foot}</div></section>`;
}
function renderA() {
  const turns = allTurns();
  return `<div class="a-list">${turns.map((t, i) => aTurn(t, {
    folded: i < turns.length - 2,
    workOpen: !!t.live,
  })).join('')}</div>`;
}

// ═════════════ B · Reader ═════════════
function bSentence(t) {
  const c = tally(t);
  const parts = [];
  if (c.read) parts.push(`read ${plural(c.read, 'file', 'files')}`);
  if (c.search) parts.push(c.search === 1 ? 'searched once' : `searched ${c.search} times`);
  if (c.edit) parts.push(`edited ${plural(c.edit, 'file', 'files')}`);
  if (c.cmd) parts.push(`ran ${plural(c.cmd, 'command', 'commands')}${c.fail ? ` <span class="fail">(${c.fail} failed)</span>` : ''}`);
  let list = parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts.at(-1) : parts[0] ?? '';
  list = list.charAt(0).toUpperCase() + list.slice(1);
  if (!t.live) return `Worked for ${t.took}. ${list}.`;
  const lead = { attention: 'Waiting for you', working: esc(t.activity), error: 'Stopped' }[t.status];
  return `${lead} · ${t.took}. ${list} so far.`;
}
function bTurn(t) {
  const live = !!t.live;
  const receiptCls = live ? t.status : '';
  const receipt = `<button class="b-receipt ${receiptCls}" aria-expanded="false" data-toggle-next>
      ${live ? stateSq(t.status) : '<span class="caret">›</span>'}<span>${bSentence(t)}</span></button>
    <div class="b-steps steps" hidden>${t.steps.map(stepRow).join('')}</div>`;
  let body = '';
  if (t.answer) body = `<div class="b-answer md">${t.answer}</div>`;
  else if (t.permission) body = `<div class="b-perm">${permissionHtml(t.permission)}</div>`;
  else if (t.error) body = errorHtml(t.error);
  const files = t.files.length
    ? `<div class="b-files">${live ? 'Changed so far' : 'Files changed'}: ${t.files.map((f) => `<a>${esc(f.path)}</a> ${changeHtml(f.add, f.del)}`).join(', ')}</div>`
    : '';
  const margin = `<aside class="b-margin"><dl>
      <dt>Turn</dt><dd>${t.n}</dd>
      <dt>Sent</dt><dd>${t.time}</dd>
      <dt>${live ? 'So far' : 'Took'}</dt><dd>${t.took}</dd>
      ${t.cost ? `<dt>Cost</dt><dd>${t.cost}</dd>` : ''}
    </dl>${live ? '' : '<div class="acts"><button class="btn quiet xs">Rewind to here</button><button class="btn quiet xs">Copy answer</button><button class="btn quiet xs">Read in Focus</button></div>'}</aside>`;
  return `<article class="b-turn" data-turn="${t.n}"><div class="b-main">
      <div class="b-you"><span class="sq"></span>You</div>
      <p class="b-prompt">${esc(t.prompt)}</p>
      ${receipt}${body}${files}
    </div>${margin}</article>`;
}
function renderB() {
  return `<div class="b-list">${allTurns().map(bTurn).join('')}</div>`;
}

// ═════════════ C · Timeline ═════════════
function cStepRows(t) {
  const out = [];
  const steps = t.steps;
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    // Consecutive reads fold into one row.
    if (s.k === 'read' && steps[i + 1]?.k === 'read') {
      let j = i;
      while (steps[j + 1]?.k === 'read') j++;
      const group = steps.slice(i, j + 1);
      out.push(`<div class="c-row k-read more" data-k="read" role="button" tabindex="0"><span class="c-time">${s.at}</span><span class="c-node"></span>
        <span class="c-w">read</span><span class="c-t c-group">${group.length} files: ${group.map((g) => esc(g.target.split('/').pop())).join(', ')} ›</span><span class="c-r">${group.reduce((n, g) => n + parseInt(g.res), 0)} lines</span>
        <div class="c-sub steps" hidden>${group.map(stepRow).join('')}</div></div>`);
      i = j;
      continue;
    }
    if (s.k === 'note') {
      out.push(`<div class="c-row c-note" data-k="note"><span class="c-time">${s.at}</span><span class="c-node"></span><div class="c-x">${s.text}</div></div>`);
      continue;
    }
    if (s.k === 'think') {
      out.push(`<div class="c-row k-think" data-k="think"><span class="c-time">${s.at}</span><span class="c-node"></span><span class="c-w">think</span><span class="c-t">${esc(s.text)}</span><span class="c-r"></span></div>`);
      continue;
    }
    if (s.k === 'perm') {
      const ok = s.answer !== 'Denied';
      out.push(`<div class="c-row k-perm" data-k="perm"><span class="c-time">${s.at}</span><span class="c-node"></span><span class="c-w">asked</span><span class="c-t"><span class="${ok ? 'pass' : 'fail'}">${esc(s.answer)}</span> <span class="m">to run</span> ${esc(s.target)}</span><span class="c-r"></span></div>`);
      continue;
    }
    const word = { read: 'read', search: 'search', edit: 'edit', cmd: 'run' }[s.k];
    const target = s.k === 'search' ? `${esc(s.target)} <span class="m">in ${esc(s.where)}</span>`
      : s.k === 'cmd' ? `$ ${esc(s.target)}` : esc(s.target);
    const more = !!(s.diff || s.out);
    const failed = s.ok === false;
    let link = '';
    if (failed) {
      const fix = steps.find((x) => x.retryOf === s.id);
      if (fix) link = `<span class="fixed">passed on retry at ${fix.at}</span>`;
    }
    if (s.retryOf) {
      const first = steps.find((x) => x.id === s.retryOf);
      if (first) link = `<span class="linked">retry of ${first.at}</span>`;
    }
    out.push(`<div class="c-row k-${s.k}${failed ? ' failed' : ''}${s.pending ? ' pending' : ''}${more ? ' more' : ''}" data-k="${s.k}"${more ? ' role="button" tabindex="0"' : ''}>
      <span class="c-time">${s.at}</span><span class="c-node"></span><span class="c-w">${word}</span>
      <span class="c-t">${target}</span><span class="c-r">${resultHtml(s)}${link}</span>
      ${more ? `<div class="c-sub"${failed ? '' : ' hidden'}><div class="detail">${detailHtml(s)}</div></div>` : ''}</div>`);
  }
  return out.join('');
}
function cTurn(t) {
  const c = tally(t);
  const rows = [];
  rows.push(`<div class="c-row c-prompt"><span class="c-time">${t.time}</span><span class="c-node"></span><div class="c-p"><span class="gt">&gt;</span>${esc(t.prompt)}</div></div>`);
  rows.push(cStepRows(t));
  if (t.answer) {
    rows.push(`<div class="c-row c-answer" data-k="answer"><span class="c-time">${t.answerAt}</span><span class="c-node"></span><div class="c-x"><div class="lab">Answer</div><div class="md">${t.answer}</div></div></div>`);
  }
  if (t.permission) {
    rows.push(`<div class="c-row c-perm c-keep"><span class="c-time">${t.permission.at}</span><span class="c-node pulse"></span><div class="c-x">${permissionHtml(t.permission)}</div></div>`);
  }
  if (t.error) {
    rows.push(`<div class="c-row c-err c-keep"><span class="c-time">${t.error.at}</span><span class="c-node"></span><div class="c-x">${errorHtml(t.error)}</div></div>`);
  }
  const endBits = t.live
    ? [`<span>${stateSq(t.status)} ${STATE_WORD[t.status]} · ${t.took} so far</span>`]
    : [`<span>${stateSq('done')} Done in ${t.took}</span>`, `<span>${t.cost}</span>`];
  if (c.edit) endBits.push(`<span>${plural(c.edit, 'file', 'files')} ${changeHtml(c.add, c.del)}</span>`);
  if (!t.live) endBits.push('<button class="btn quiet xs">Rewind</button>');
  rows.push(`<div class="c-row c-end"><span class="c-time"></span><span class="c-node"></span><div class="c-x">${endBits.join('')}</div></div>`);
  return `<section class="c-turn" id="c-turn-${t.n}">${rows.join('')}</section>`;
}
function renderC() {
  const turns = allTurns();
  const counts = { edit: 0, cmd: 0, fail: 0, answer: 0 };
  for (const t of turns) {
    for (const s of t.steps) {
      if (s.k === 'edit') counts.edit++;
      if (s.k === 'cmd') counts.cmd++;
      if (s.ok === false) counts.fail++;
    }
    if (t.answer) counts.answer++;
  }
  const f = state.cFilter;
  const btn = (v, label, n) => `<button data-filter="${v}" aria-pressed="${f === v}">${label}${n !== undefined ? `<span class="ct">${n}</span>` : ''}</button>`;
  const outline = turns.map((t) => {
    const c = tally(t);
    const sub = [c.edit ? plural(c.edit, 'edit', 'edits') : null, c.cmd ? plural(c.cmd, 'command', 'commands') : null, c.fail ? `${c.fail} failed` : null].filter(Boolean).join(' · ') || 'no changes';
    return `<button data-jump="${t.n}">${stateSq(t.status)}<span class="n">${t.n}</span><span class="p">${esc(t.prompt)}</span><span class="s">${sub}</span></button>`;
  }).join('');
  const jump = turns.map((t) => `<button data-jump="${t.n}">${stateSq(t.status)}${t.n}</button>`).join('');
  return `<div class="c-wrap" data-filter="${f}">
    <div class="c-tools"><span>Show</span><div class="seg">${btn('all', 'Everything')}${btn('answer', 'Answers', counts.answer)}${btn('edit', 'Edits', counts.edit)}${btn('cmd', 'Commands', counts.cmd)}${btn('fail', 'Failures', counts.fail)}</div>
      <span class="jump"><span>Turn</span>${jump}</span></div>
    <div class="c-body"><div class="c-rail">${turns.map(cTurn).join('')}</div>
      <nav class="c-outline" aria-label="Turns"><div class="hd">Turns</div>${outline}</nav></div>
  </div>`;
}

// ═════════════ Notes beside the frame ═════════════
const NOTES = {
  current: `<h2>Current</h2><p class="sub">Today's Thread tab in Summary view (the default), from the demo harness with the same sample thread. The live turn switch doesn't apply here.</p>
    <div class="tag">What gets in the way</div>
    <ul><li>The end of a turn is a small <code>done $0.4100 192.0s</code> line, so turns run into each other.</li>
    <li>Reads, edits and commands all use the same left-border row. A long turn reads as one even list.</li>
    <li>The final answer has the same weight as the notes the agent wrote while working.</li>
    <li>A failed test and the run that fixed it aren't linked.</li></ul>`,
  a: `<h2>A · Turn cards</h2><p class="sub">Each prompt and everything the agent did for it is one unit you can fold.</p>
    <ul><li>Card: your prompt, a one-line work strip, the answer, then files changed and cost.</li>
    <li>The work strip has a pixel trail: one square per step, in order. Green edits, cyan commands, red a failure. The words next to it say the same, so colour isn't needed to read it.</li>
    <li>Turns older than the last two fold to one line with files, time and cost.</li>
    <li>The live turn keeps its steps open and puts the permission in the card, with the card's edge in the status colour.</li></ul>
    <div class="tag">Trade-offs</div>
    <ul><li>More borders than today. Long answers sit inside a box.</li>
    <li>The message list is flat today. Grouping it into turns (each prompt up to its result) uses data the renderer already has.</li></ul>
    <div class="tag">Try</div><ul><li>Click a turn's header to fold it, and the work strip to see the steps. Click a step with › to see its diff or output.</li></ul>`,
  b: `<h2>B · Reader</h2><p class="sub">Built for reading answers. The work steps back unless you ask for it.</p>
    <ul><li>A column about 70 characters wide, more line spacing, no boxes around messages.</li>
    <li>Your prompt is a heading. The work is one sentence: "Worked for 3m 12s. Read 3 files, ... (1 failed)."</li>
    <li>Turn number, time and cost sit in the margin when there's room, and under the answer when there isn't.</li>
    <li>A failure still shows in red in the sentence, so nothing hides that you'd need to know.</li></ul>
    <div class="tag">Trade-offs</div>
    <ul><li>You see the least of what the agent did. Reviewing edits means opening each turn or using the Changes tab.</li>
    <li>Uses the most space per turn; fewer turns fit on screen.</li></ul>
    <div class="tag">Try</div><ul><li>Click the "Worked for..." line. Switch to Narrow to see the margin move.</li></ul>`,
  c: `<h2>C · Timeline</h2><p class="sub">Built for scanning what happened, step by step.</p>
    <ul><li>Every step is one line on a rail, with the time since the prompt. Consecutive reads fold into one row.</li>
    <li>Filters at the top: only answers, edits, commands or failures. "Answers" works as a reading view.</li>
    <li>A failed command links to the run that passed after it (same command, later success).</li>
    <li>The outline on the right jumps between turns and shows each one's state. On narrow widths it becomes buttons in the bar.</li></ul>
    <div class="tag">Trade-offs</div>
    <ul><li>The densest and busiest. Answers compete with the rows around them, so they get a box.</li>
    <li>Step times need a timestamp on each tool event. Today only prompts and results carry one.</li></ul>
    <div class="tag">Try</div><ul><li>Pick Failures, then Edits. Click a turn in the outline. Click a row with › for its diff or output.</li></ul>`,
};

// ───────────── Render and wire up ─────────────
function render() {
  document.body.dataset.theme = state.theme;
  document.body.dataset.width = state.width;
  for (const [id, key] of [['seg-design', 'design'], ['seg-live', 'live'], ['seg-theme', 'theme'], ['seg-width', 'width']]) {
    for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', String(b.dataset.v === state[key]));
  }
  const list = document.getElementById('list');
  list.className = 'list' + (state.design === 'current' ? ' current' : '');
  list.innerHTML = { current: renderCurrent, a: renderA, b: renderB, c: renderC }[state.design]();
  document.getElementById('notes').innerHTML = NOTES[state.design];
  const sb = document.getElementById('sb-state');
  sb.innerHTML = `${stateSq(state.live)} ${STATE_WORD[state.live]}`;
  sb.style.display = 'inline-flex'; sb.style.alignItems = 'center'; sb.style.gap = '6px';
  history.replaceState(null, '', `#${state.design}-${state.live}-${state.theme}-${state.width}`);
  // Like the app: open at the newest output.
  list.scrollTop = list.scrollHeight;
}

for (const [id, key] of [['seg-design', 'design'], ['seg-live', 'live'], ['seg-theme', 'theme'], ['seg-width', 'width']]) {
  document.getElementById(id).addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state[key] = b.dataset.v;
    if (key === 'live') state.answered = null;
    render();
  });
}

document.getElementById('list').addEventListener('click', (e) => {
  const el = e.target;
  const ans = el.closest('[data-answer]');
  if (ans) { state.answered = ans.dataset.answer; state.live = 'working'; render(); return; }
  const filter = el.closest('[data-filter]');
  if (filter && filter.tagName === 'BUTTON') { state.cFilter = filter.dataset.filter; render(); return; }
  const jump = el.closest('[data-jump]');
  if (jump) {
    const target = document.getElementById('c-turn-' + jump.dataset.jump);
    const list = document.getElementById('list');
    list.scrollTo({ top: target.offsetTop - 40, behavior: 'smooth' });
    return;
  }
  const fold = el.closest('[data-fold]');
  if (fold) { fold.parentElement.classList.toggle('folded'); return; }
  const tog = el.closest('[data-toggle-next]');
  if (tog) {
    const next = tog.nextElementSibling;
    next.hidden = !next.hidden;
    tog.setAttribute('aria-expanded', String(!next.hidden));
    return;
  }
  const crow = el.closest('.c-row.more');
  if (crow && !el.closest('.c-sub')) {
    const sub = crow.querySelector('.c-sub');
    if (sub) sub.hidden = !sub.hidden;
    return;
  }
  const row = el.closest('.row.more');
  if (row) {
    const d = row.nextElementSibling;
    d.hidden = !d.hidden;
    row.classList.toggle('open', !d.hidden);
  }
});
document.getElementById('list').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
});

render();
</script>
</body>
</html>
