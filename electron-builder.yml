appId: com.parsonsprojects.grove-bench
productName: Grove Bench
copyright: Copyright © 2026 Alan Parsons

directories:
  output: out

files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - "!node_modules/**/{test,tests,__tests__,__mocks__,docs}/**"
  - "!node_modules/**/*.{md,ts,map}"
  - "!src/**"
  - "!landing/**"
  - "!docs/**"

extraResources:
  - from: src/main/icon.ico
    to: icon.ico

# Don't rebuild native modules. node-pty (the only one) ships Node-API
# prebuilds that load in any Electron version, and rebuilding it from source
# needs a Visual Studio release that @electron/node-gyp recognises.
npmRebuild: false

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.dll"
  - "**/node-pty/**"
  # The agent SDK's native `claude` binary: the OS can't run a file inside
  # app.asar, so the app runs it from app.asar.unpacked (claude-code.ts).
  - "**/@anthropic-ai/claude-agent-sdk-*/**"
  # The MCP stdio bridge, which agents start as a separate process
  # (adapters/mcp-bridge/launch.ts).
  - "dist/main/mcp-stdio-bridge.js"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/main/icon.ico
  # Installers are unsigned, so Windows SmartScreen warns on first run.
  # To sign, add azureSignOptions (Azure Trusted Signing) here and pass the
  # AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET secrets to the
  # "Build installer" step in .github/workflows/package.yml.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # No spaces: GitHub release asset names can't contain them, and latest.yml
  # has to match the uploaded file name for auto-update to find the installer.
  artifactName: Grove-Bench-Setup-${version}.${ext}

# Feeds the in-app updater (app-update.yml) and latest.yml. electron-builder
# never uploads (`--publish never`); the Release workflow publishes with gh.
publish:
  provider: github
  owner: ParsonsProjects
  repo: grove-bench
  vPrefixedTagName: true
